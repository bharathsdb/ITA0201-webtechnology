<!DOCTYPE html>
<html>
<head>
    <title>College Website</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: Arial;
            background: #f8fafc;
        }

        header {
            background: #7c3aed;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background: #4c1d95;
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .hero {
            padding: 70px 20px;
            text-align: center;
            background: #ede9fe;
        }

        .hero h2 {
            font-size: 35px;
            color: #5b21b6;
        }

        .courses {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px #bbb;
        }

        .card h3 {
            color: #7c3aed;
            margin-bottom: 10px;
        }

        footer {
            background: #1e1b4b;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media(max-width:700px) {
            .courses {
                grid-template-columns: 1fr;
            }

            nav {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>ABC College</h1>
    <p>Knowledge • Excellence • Success</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Courses</a>
    <a href="#">Contact</a>
</nav>

<section class="hero">
    <h2>Welcome to ABC College</h2>
    <p>Build your future with quality education.</p>
</section>

<section class="courses">

    <div class="card">
        <h3>Computer Science</h3>
        <p>Learn programming and technology.</p>
    </div>

    <div class="card">
        <h3>Commerce</h3>
        <p>Learn business and accounting.</p>
    </div>

    <div class="card">
        <h3>Arts</h3>
        <p>Explore creativity and humanities.</p>
    </div>

</section>

<footer>
    <p>© 2026 ABC College</p>
</footer>

</body>
</html>
