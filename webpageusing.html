<!DOCTYPE html>
<html>
<head>
    <title>Images, Links and Iframe</title>

    <style>
        body {
            font-family: Arial;
            background: #fff7ed;
            margin: 30px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px #aaa;
        }

        h1 {
            color: #ea580c;
        }

        img {
            width: 250px;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
            margin: 15px;
        }

        a {
            color: #ea580c;
            font-weight: bold;
        }

        iframe {
            width: 100%;
            height: 300px;
            border: 2px solid #ea580c;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Images, Hyperlinks and Iframes</h1>

    <h2>Image</h2>

    <img src="https://via.placeholder.com/250x160"
         alt="Sample Image">

    <h2>Hyperlink</h2>

    <p>
        Visit
        <a href="https://www.wikipedia.org"
           target="_blank">
           Wikipedia
        </a>
    </p>

    <h2>Iframe</h2>

    <iframe
        src="https://www.example.com"
        title="Example Website">
    </iframe>

</div>

</body>
</html>
