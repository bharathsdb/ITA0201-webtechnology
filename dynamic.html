<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial;
            background: #fff7ed;
        }

        .todo {
            width: 90%;
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px #aaa;
        }

        h1 {
            text-align: center;
            color: #ea580c;
        }

        .input {
            display: flex;
            margin-top: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #aaa;
        }

        button {
            padding: 12px 18px;
            border: none;
            background: #ea580c;
            color: white;
            cursor: pointer;
        }

        li {
            list-style: none;
            padding: 12px;
            margin-top: 10px;
            background: #ffedd5;
            display: flex;
            justify-content: space-between;
        }

        li button {
            background: #dc2626;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

<div class="todo">

    <h1>My To-Do List</h1>

    <div class="input">
        <input id="task" placeholder="Enter a task">
        <button onclick="addTask()">Add</button>
    </div>

    <ul id="list"></ul>

</div>

<script>
function addTask() {

    let task = document.getElementById("task").value;

    if (task == "") {
        alert("Enter a task");
        return;
    }

    let li = document.createElement("li");

    li.innerHTML =
        task +
        '<button onclick="deleteTask(this)">Delete</button>';

    document.getElementById("list").appendChild(li);

    document.getElementById("task").value = "";
}

function deleteTask(button) {
    button.parentElement.remove();
}
</script>

</body>
</html>
