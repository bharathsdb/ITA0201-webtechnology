<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Processing System | Java Servlet Demo</title>
    <meta name="description" content="Server-side Student Result Processing using Java Servlet doPost method with validation and dynamic report generation.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="campus.jpg" alt="SIMATS Engineering Campus" style="width: 100%; height: 200px; object-fit: cover; border-radius: var(--radius-md) var(--radius-md) 0 0; margin-top: -2.5rem; margin-left: -2.5rem; width: calc(100% + 5rem); margin-bottom: 2rem; border-bottom: 1px solid var(--border-color);">
            <div class="card-header">
                <span class="badge-tag">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    Experiment 2 &bull; Faculty Portal
                </span>
                <h1>Student Result Processing</h1>
                <p>Enter student details and marks to compute total, average, highest score, and pass/fail status via Java Servlet.</p>
            </div>

            <!-- Preset Buttons for quick demo -->
            <div style="display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; flex-wrap: wrap;">
                <button type="button" class="btn-action btn-secondary" style="width: auto; margin-top: 0; padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="loadDemo('pass')">
                    &check; Preset: Distinction Pass
                </button>
                <button type="button" class="btn-action btn-secondary" style="width: auto; margin-top: 0; padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="loadDemo('boundary')">
                    &star; Preset: Boundary (40)
                </button>
                <button type="button" class="btn-action btn-secondary" style="width: auto; margin-top: 0; padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="loadDemo('fail')">
                    &cross; Preset: Arrear / Fail
                </button>
            </div>

            <form id="resultForm" action="StudentResultServlet" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="studentName">Student Full Name <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="text" id="studentName" name="studentName" placeholder="e.g. Alex Johnson" required autocomplete="off">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regNo">Register Number <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                                <line x1="7" y1="8" x2="17" y2="8"></line>
                                <line x1="7" y1="12" x2="17" y2="12"></line>
                                <line x1="7" y1="16" x2="12" y2="16"></line>
                            </svg>
                            <input type="text" id="regNo" name="regNo" placeholder="e.g. 2026CS101" required autocomplete="off">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="sub1">Subject 1: Data Structures & Algorithms (0-100) <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                        </svg>
                        <input type="number" id="sub1" name="sub1" min="0" max="100" step="0.5" placeholder="Enter marks (0 - 100)" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="sub2">Subject 2: Database Management Systems (0-100) <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                        </svg>
                        <input type="number" id="sub2" name="sub2" min="0" max="100" step="0.5" placeholder="Enter marks (0 - 100)" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="sub3">Subject 3: Web Technologies & Servlets (0-100) <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                        <input type="number" id="sub3" name="sub3" min="0" max="100" step="0.5" placeholder="Enter marks (0 - 100)" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                    Process &amp; Calculate Result
                </button>
            </form>

            <div class="footer-note">
                Server-side computation with Java Servlet &bull; Concurrency Safe &bull; Jakarta EE / Java EE Compatible
            </div>
        </div>
    </div>

    <script>
        function loadDemo(type) {
            if (type === 'pass') {
                document.getElementById('studentName').value = 'Sophia Martinez';
                document.getElementById('regNo').value = '2026CS101';
                document.getElementById('sub1').value = '92';
                document.getElementById('sub2').value = '88';
                document.getElementById('sub3').value = '96';
            } else if (type === 'boundary') {
                document.getElementById('studentName').value = 'Ethan Davis';
                document.getElementById('regNo').value = '2026CS102';
                document.getElementById('sub1').value = '40';
                document.getElementById('sub2').value = '45';
                document.getElementById('sub3').value = '42';
            } else if (type === 'fail') {
                document.getElementById('studentName').value = 'Lucas Wright';
                document.getElementById('regNo').value = '2026CS103';
                document.getElementById('sub1').value = '34';
                document.getElementById('sub2').value = '85';
                document.getElementById('sub3').value = '76';
            }
        }
    </script>
</body>
</html>
