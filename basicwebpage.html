<!DOCTYPE html>
<html>
<head>
    <title>Basic HTML Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eef2ff;
            margin: 40px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #aaa;
        }

        h1 {
            color: #4f46e5;
        }

        hr {
            border: 2px solid #4f46e5;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Welcome to My Web Page</h1>

    <h2>About HTML</h2>

    <p>
        HTML stands for <b>HyperText Markup Language</b>.
        It is used to create web pages.
    </p>

    <p>
        This is a <i>simple</i> HTML page with
        <u>different formatting tags</u>.
    </p>

    <hr>

    <p>
        Water formula: H<sub>2</sub>O
    </p>

    <p>
        Mathematical expression: X<sup>2</sup> + Y<sup>2</sup>
    </p>

    <p>
        This is a line break.<br>
        This text appears on a new line.
    </p>

</div>

</body>
</html>
