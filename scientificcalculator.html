<!DOCTYPE html>
<html>
<head>
    <title>Scientific Calculator</title>

    <style>
        body {
            font-family: Arial;
            background: #111827;
        }

        .calculator {
            width: 320px;
            margin: 50px auto;
            padding: 20px;
            background: #1f2937;
            border-radius: 15px;
            box-shadow: 0 5px 20px #000;
        }

        h2 {
            color: white;
            text-align: center;
        }

        #display {
            width: 100%;
            height: 55px;
            font-size: 22px;
            margin: 15px 0;
            padding: 10px;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #93c5fd;
        }

        .operator {
            background: #60a5fa;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h2>Scientific Calculator</h2>

    <input id="display" readonly>

    <div class="buttons">

        <button onclick="clearDisplay()">C</button>
        <button onclick="backspace()">⌫</button>
        <button onclick="calculate('Math.sqrt')">√</button>
        <button class="operator" onclick="add('/')">/</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button class="operator" onclick="add('*')">*</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button class="operator" onclick="add('-')">-</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button class="operator" onclick="add('+')">+</button>

        <button onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>
        <button onclick="calculate('Math.sin')">sin</button>
        <button onclick="calculate('Math.cos')">cos</button>

        <button onclick="calculate('Math.tan')">tan</button>
        <button onclick="calculate('Math.log10')">log</button>
        <button onclick="calculate('Math.pow')">x²</button>
        <button onclick="result()">=</button>

    </div>
</div>

<script>
let display = document.getElementById("display");

function add(value) {
    display.value += value;
}

function clearDisplay() {
    display.value = "";
}

function backspace() {
    display.value = display.value.slice(0, -1);
}

function result() {
    try {
        display.value = eval(display.value);
    } catch {
        display.value = "Error";
    }
}

function calculate(type) {
    let value = Number(display.value);

    if (type == "Math.sqrt")
        display.value = Math.sqrt(value);

    else if (type == "Math.sin")
        display.value = Math.sin(value * Math.PI / 180);

    else if (type == "Math.cos")
        display.value = Math.cos(value * Math.PI / 180);

    else if (type == "Math.tan")
        display.value = Math.tan(value * Math.PI / 180);

    else if (type == "Math.log10")
        display.value = Math.log10(value);

    else if (type == "Math.pow")
        display.value = Math.pow(value, 2);
}
</script>

</body>
</html>
